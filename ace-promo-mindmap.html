<title>에이스침대 프로모션 아이디어 보드</title>
<style>
  :root {

    --panel: #ffffff;
    --ink: #1a2233;
    --ink-soft: #4d5a72;
    --ink-faint: #8a94a8;
    --accent: #1d4e9e;
    --accent-ink: #ffffff;
    --accent-soft: #e8eef8;
    --line: #dfe4ec;
    --leaf-bg: #f2f5fa;
    --warn: #9a6b1f;
    --warn-bg: #faf3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f; --panel: #1a202c; --ink: #e8ecf3; --ink-soft: #a8b2c4;
      --ink-faint: #6b7688; --accent: #6fa0e8; --accent-ink: #101724;
      --accent-soft: #22304a; --line: #2c3546; --leaf-bg: #212a3a;
      --warn: #d9b36a; --warn-bg: #33290f;
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1a2233; --ink-soft: #4d5a72;
    --ink-faint: #8a94a8; --accent: #1d4e9e; --accent-ink: #ffffff;
    --accent-soft: #e8eef8; --line: #dfe4ec; --leaf-bg: #f2f5fa;
    --warn: #9a6b1f; --warn-bg: #faf3e3;
  }
  :root[data-theme="dark"] {
    --bg: #12161f; --panel: #1a202c; --ink: #e8ecf3; --ink-soft: #a8b2c4;
    --ink-faint: #6b7688; --accent: #6fa0e8; --accent-ink: #101724;
    --accent-soft: #22304a; --line: #2c3546; --leaf-bg: #212a3a;
    --warn: #d9b36a; --warn-bg: #33290f;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6; margin: 0; padding: 2rem 1.25rem 4rem;
  }
  .wrap { max-width: 780px; margin: 0 auto; }

  header { margin-bottom: 1.5rem; }
  .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .4rem; }
  h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 .3rem; letter-spacing: -.01em; text-wrap: balance; }
  .meta { color: var(--ink-faint); font-size: .82rem; margin: 0; }

  /* ── 탭 내비게이션 ── */
  nav { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  nav button {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    color: var(--ink-soft); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px;
    padding: .4rem 1rem; transition: background .15s, color .15s;
  }
  nav button:hover { background: var(--accent-soft); color: var(--accent); }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  nav button:focus-visible, .leaf > summary:focus-visible, .branch > summary:focus-visible,
  .toolbar button:focus-visible, .ov-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  section[hidden] { display: none; }

  /* ── 개요 탭 ── */
  .ov-grid { display: grid; gap: .8rem; }
  .ov-card {
    display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 1rem 1.2rem; color: inherit; transition: border-color .15s;
  }
  .ov-card:hover { border-color: var(--accent); }
  .ov-top { display: flex; align-items: center; gap: .55rem; margin-bottom: .3rem; }
  .idea-no { font-size: .7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: .12rem .45rem; letter-spacing: .08em; }
  .ov-title { font-size: 1rem; font-weight: 700; }
  .ov-sum { color: var(--ink-soft); font-size: .88rem; margin: 0 0 .55rem; }
  .chips { display: flex; gap: .35rem; flex-wrap: wrap; }
  .chip { font-size: .74rem; color: var(--ink-faint); background: var(--leaf-bg); border-radius: 4px; padding: .1rem .5rem; }
  .synergy {
    margin-top: 1.2rem; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 1rem 1.2rem;
  }
  .synergy h3 { margin: 0 0 .5rem; font-size: .85rem; font-weight: 700; color: var(--accent); }
  .synergy p { margin: 0; color: var(--ink-soft); font-size: .88rem; }

  /* ── 아이디어 상세 탭 ── */
  .idea-head { margin-bottom: 1rem; }
  .idea-head h2 { font-size: 1.15rem; font-weight: 700; margin: .2rem 0 .35rem; display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
  .idea-head .date { color: var(--ink-faint); font-size: .78rem; }
  .idea-head p.sum { color: var(--ink-soft); font-size: .9rem; margin: 0; }

  .toolbar { display: flex; gap: .4rem; margin: 1rem 0 .8rem; }
  .toolbar button {
    font: inherit; font-size: .76rem; font-weight: 600; cursor: pointer;
    color: var(--ink-soft); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: .25rem .7rem;
  }
  .toolbar button:hover { color: var(--accent); border-color: var(--accent); }

  /* 트리: 루트 세로선 + 가지 아코디언 */
  .tree { position: relative; padding-left: 1rem; }
  .tree::before { content: ""; position: absolute; left: 0; top: .5rem; bottom: .5rem; width: 3px; border-radius: 2px; background: var(--accent); opacity: .35; }
  .branch { margin-bottom: .5rem; }
  .branch > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: .5rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .9rem; font-weight: 700; font-size: .92rem; user-select: none;
  }
  .branch > summary::-webkit-details-marker { display: none; }
  .branch > summary:hover { border-color: var(--accent); }
  .branch[open] > summary { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .branch > summary .n { margin-left: auto; font-size: .72rem; font-weight: 600; color: var(--ink-faint); }
  .branch > summary .arrow { font-size: .7rem; color: var(--ink-faint); transition: transform .15s; }
  .branch[open] > summary .arrow { transform: rotate(90deg); }
  .branch.warn > summary { border-style: dashed; }
  .branch.warn[open] > summary { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }

  .leaves { padding: .45rem 0 .3rem 1.1rem; display: flex; flex-direction: column; gap: .3rem; }
  .leaf { border-radius: 7px; }
  .leaf > summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: baseline; gap: .45rem;
    background: var(--leaf-bg); border: 1px solid transparent; border-radius: 7px;
    padding: .35rem .75rem; font-size: .86rem; font-weight: 600; color: var(--ink); user-select: none;
  }
  .leaf > summary::-webkit-details-marker { display: none; }
  .leaf > summary:hover { border-color: var(--accent); }
  .leaf[open] > summary { background: var(--accent-soft); color: var(--accent); }
  .leaf > summary .more { font-size: .68rem; color: var(--ink-faint); }
  .leaf p { margin: .3rem 0 .5rem; padding: 0 .8rem; color: var(--ink-soft); font-size: .84rem; max-width: 60ch; }
  .leaf.plain > summary { cursor: default; }
  .leaf.plain > summary:hover { border-color: transparent; }

  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: .78rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

        { t: "아기 안전 패키지 증정", d: "RAQUEL 구매 시 가드레일·낙상매트 증정 — '아이와 함께 자는 침대' 맥락을 혜택으로 표현." },
      ]},
      { name: "멤버십 확장", leaves: [
        { t: "패밀리멤버스 자동 승급", d: "출산 등록 시 등급 상승·혜택 갱신. 멤버십이 결혼 시점에서 소멸하지 않고 계속 살아있게 된다." },
        { t: "자녀 성장 로드맵", d: "출생년도 등록 시 패밀리침대(0~4세) → 주니어(5~7세) → 학생 침대(초등 입학) 시점마다 오퍼 자동 발송." },
        { t: "추천 리워드", d: "예비부부 주변엔 예비부부가 많다. 소개 시 양쪽 혜택으로 가입 입구 확대." },
      ]},
      { name: "CRM 시나리오", leaves: [
        { t: "구매 1주년 케어 메시지", d: "매트리스 관리 안내 등 판매 없는 접촉으로 관계 유지." },
        { t: "3년차 시그널 캠페인", d: "가입 3년차부터 패밀리침대 콘텐츠 노출 시작." },
        { t: "수면 콘텐츠 자산화", d: "임산부·신생아 수면 콘텐츠를 멤버스 전용 제공 — '침대는 과학' 브랜드 자산과 맞물리는 접점." },
      ]},
      { name: "제휴 채널", leaves: [
        { t: "산후조리원·산부인과", d: "출산 시점 고객을 가장 정확히 만나는 채널. 조리원 내 체험존도 검토." },
        { t: "웨딩플래너·스튜디오", d: "웨딩멤버스 가입 입구 자체를 확대." },
        { t: "육아 플랫폼", d: "육아 커뮤니티·앱과 공동 프로모션으로 RAQUEL 인지도 확보." },
      ]},
      { name: "KPI", leaves: [
        { t: "멤버스 2차 구매 전환율" }, { t: "쿠폰 회수율" }, { t: "가족 단위 LTV" },
      ]},
      { name: "검토 필요", warn: true, leaves: [
        { t: "개인정보 동의", d: "출산·자녀 정보는 수집 목적·보관 기간 명시와 별도 동의 필수." },
        { t: "쿠폰 회계 처리", d: "5년 유효 쿠폰의 충당부채 처리 방식 재무 협의." },
      ]},
    ],
  },
];

const SYNERGY = "IDEA 01의 보상판매 트레이드인이 IDEA 02의 '첫 할부금 차감'과 IDEA 03의 '신혼 침대 → RAQUEL 전환'에 모두 연결됩니다. 세 아이디어를 묶으면 \"기존 침대 반납 → 보상금으로 초기 부담 0원 → 장기 무이자로 월 부담 최소화\"라는 하나의 패밀리 전환 패키지가 됩니다.";

const nav = document.getElementById("nav");
const main = document.getElementById("main");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

document.getElementById("meta").textContent =
  `최근 업데이트 ${IDEAS[IDEAS.length-1].date} · 아이디어 ${IDEAS.length}건`;

/* 탭 */
const tabs = [{ id: "overview", label: "전체 개요" }, ...IDEAS.map(i => ({ id: i.id, label: `IDEA ${i.id}` }))];
tabs.forEach(t => {
  const b = document.createElement("button");
  b.textContent = t.label; b.dataset.tab = t.id;
  b.setAttribute("role", "tab");
  b.addEventListener("click", () => select(t.id));
  nav.appendChild(b);
});

/* 개요 섹션 */
const ov = document.createElement("section");
ov.dataset.tab = "overview";
ov.innerHTML = `
  <div class="ov-grid">
    ${IDEAS.map(i => `
      <button class="ov-card" data-goto="${i.id}">
        <span class="ov-top"><span class="idea-no">IDEA ${i.id}</span><span class="ov-title">${esc(i.title)}</span></span>
        <p class="ov-sum">${esc(i.summary)}</p>
        <span class="chips">${i.keywords.map(k => `<span class="chip">${esc(k)}</span>`).join("")}</span>
      </button>`).join("")}
  </div>
  <div class="synergy"><h3>아이디어 간 연결</h3><p>${esc(SYNERGY)}</p></div>`;
main.appendChild(ov);
ov.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => select(b.dataset.goto)));

/* 아이디어 섹션 */
IDEAS.forEach(idea => {
  const s = document.createElement("section");
  s.dataset.tab = idea.id;
  s.innerHTML = `
    <div class="idea-head">
      <h2><span class="idea-no">IDEA ${idea.id}</span>${esc(idea.title)}</h2>
      <p class="sum">${esc(idea.summary)}</p>
      <span class="date">${idea.date} 추가</span>
    </div>
    <div class="toolbar">
      <button data-act="open">모두 펼치기</button>
      <button data-act="close">모두 접기</button>
    </div>
    <div class="tree">
      ${idea.branches.map((br, bi) => `
        <details class="branch${br.warn ? " warn" : ""}"${bi === 0 ? " open" : ""}>
          <summary><span class="arrow">▶</span>${esc(br.name)}<span class="n">${br.leaves.length}</span></summary>
          <div class="leaves">
            ${br.leaves.map(l => l.d
              ? `<details class="leaf"><summary>${esc(l.t)}<span class="more">자세히</span></summary><p>${esc(l.d)}</p></details>`
              : `<details class="leaf plain"><summary tabindex="-1">${esc(l.t)}</summary></details>`
            ).join("")}
          </div>
        </details>`).join("")}
    </div>`;
  s.querySelector('[data-act="open"]').addEventListener("click", () => s.querySelectorAll("details").forEach(d => d.open = true));
  s.querySelector('[data-act="close"]').addEventListener("click", () => s.querySelectorAll("details").forEach(d => d.open = false));
  main.appendChild(s);
});

function select(id) {
  nav.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  main.querySelectorAll("section").forEach(sec => sec.hidden = sec.dataset.tab !== id);
}
select("overview");
</script>
